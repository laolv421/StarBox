name: Refresh feed

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:
  push:
    paths:
      - "data/**"
      - "pipeline/**"
      - ".github/workflows/refresh-feed.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-feed
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.commit.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Refresh feed JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python pipeline/refresh_feed.py

      - name: Sync bundled app resources
        run: |
          mkdir -p app/Starbox/Resources
          cp site/v1/*.json app/Starbox/Resources/

      - name: Commit site output
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/ app/Starbox/Resources/
          if git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No feed changes"
          else
            git commit -m "chore: refresh starbox feed"
            git push
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
